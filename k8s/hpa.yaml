# Horizontal Pod Autoscaler: scales the storage tier from 3 to 8 nodes on CPU.
# This is the 3 -> 8 range whose scaling efficiency sim/cluster_sim.py models.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsdb-node
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: tsdb-node
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 1, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
