syntax = "proto3";

package tsdb.v1;

// Storage/query service exposed by every node and by the router. The router
// implements the same surface as a node, so a client can talk to either; the
// router simply forwards each key to the node that owns it on the hash ring.
service TimeSeries {
  // Append a batch of samples. The server groups them by series key.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Range query over a single series, with optional server-side aggregation.
  rpc QueryRange(QueryRequest) returns (QueryResponse);

  // Liveness/stats, used by the router's health checker and k8s probes.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message Sample {
  int64 timestamp_ms = 1;
  double value = 2;
}

message Series {
  string key = 1;            // e.g. "cpu.usage{host=a,core=3}"
  repeated Sample samples = 2;
}

message WriteRequest {
  repeated Series series = 1;
}

message WriteResponse {
  uint64 accepted = 1;       // samples stored
  string node = 2;           // node id that handled the write
}

enum Aggregation {
  AGG_NONE = 0;              // return raw samples
  AGG_SUM = 1;
  AGG_AVG = 2;
  AGG_MIN = 3;
  AGG_MAX = 4;
  AGG_COUNT = 5;
}

message QueryRequest {
  string key = 1;
  int64 start_ms = 2;
  int64 end_ms = 3;
  Aggregation agg = 4;
}

message QueryResponse {
  repeated Sample samples = 1;   // populated when agg == AGG_NONE
  double scalar = 2;             // populated for aggregations
  uint64 scanned = 3;            // samples scanned to answer
  string node = 4;
}

message HealthRequest {}

message HealthResponse {
  string node = 1;
  uint64 series = 2;
  uint64 samples = 3;
}
